<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飲茶｜咪叉 · 個人頁</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 夢核背景層 -->
<div class="bg-wrap"></div>

<div class="container">

<!-- 🔹第一部分：About me -->
<section class="section intro-section">
  <div class="glass-card main‑intro">
    <!-- 透明頭像 -->
    <div class="avatar-box">
      <img src="./assets/avatar.png" alt="頭像" class="avatar">
    </div>
    <!-- 打字機標題 -->
    <h1 class="typewriter"></h1>

    <!-- 🎵仿音樂播放器卡片 -->
    <div class="music‑player‑card">
      <div class="player‑header">🎶 正在聆聽｜術曲播放清單</div>
      <div class="player‑body">
        <div class="player‑cover"></div>
        <div class="player‑info">
          <div class="song‑title">術曲隨機循環</div>
          <div class="song‑artist">飲茶 / 咪叉 的播放列表</div>
        </div>
      </div>
      <div class="player‑bar">
        <div class="progress"></div>
      </div>
      <div class="player‑ctrl">⏯ ◀ ▶</div>
    </div>

    <div class="text‑block">
      <h3>關於我</h3>
      <ul>
        <li>暱稱：飲茶 / 咪叉｜年齡：20+</li>
        <li>興趣：畫畫、術曲，微恐類遊戲</li>
        <li>近期觀看：生化危機系列、MARVEL</li>
        <li>喜愛角色：里昂、艾什莉、布萊恩、荷蘭蟲</li>
        <li>Steam遊戲：生化危機、主播女孩重度依賴、腦葉公司、火山的女兒</li>
        <li>喜歡CP：bryan、鐵蟲</li>
      </ul>
    </div>
  </div>
</section>

<!-- 🔹第二部分：自設人設卡 -->
<section class="section oc‑section">
  <div class="glass-card oc‑card">
    <h2>✦ 我的自設人設卡 ✦</h2>
    <div class="oc‑img‑grid">
      <img src="./assets/char1.png" alt="自設插圖1" class="oc‑pic">
      <img src="./assets/char2.png" alt="自設插圖2" class="oc‑pic">
      <img src="./assets/char3.png" alt="自設插圖3" class="oc‑pic">
    </div>
    <div class="oc‑desc">
      <p>動物塑是粉色小蠑螈和粉色小海豹。</p>
    </div>
  </div>
</section>

</div>

<script src="script.js"></script>
</body>
</html>
